<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="description" content="小比百貨魔獸世界永恆導航：選擇聯盟或部落，搜尋主城、鳥點及港口，取得船、飛船、地鐵、飛行與步行路線。">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c1820">
<title>小比百貨｜艾澤拉斯導航・遠征手冊</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="expedition.css?v=6"><link rel="stylesheet" href="navigation.css?v=6"><link rel="stylesheet" href="brand-enhancements.css?v=6">
<link rel="stylesheet" href="simple.css?v=6">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-flight" viewBox="0 0 24 24"><path fill="currentColor" d="M2.5 15.5c3.6.1 6.3-1 8.3-3.4C12.7 9.7 14.5 6.8 21.5 5c-1.3 3.2-3.2 5.6-5.7 7.2 2.1.3 4-.2 5.8-1.2-2.7 4.3-7.3 6.6-14 6.6H5l-2.5-2.1Z"/></symbol>
  <symbol id="i-boat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="4.8" r="2"/><path d="M12 6.8V21M8.5 10h7M4.5 13.5a7.5 7.5 0 0 0 15 0M4.5 13.5l-1.5 1.8M19.5 13.5l1.5 1.8"/></g></symbol>
  <symbol id="i-walk" viewBox="0 0 24 24"><g fill="currentColor"><ellipse cx="8" cy="8.5" rx="2.6" ry="4"/><ellipse cx="7.6" cy="15.2" rx="1.7" ry="1.4"/><ellipse cx="16" cy="12.5" rx="2.6" ry="4"/><ellipse cx="16.4" cy="19.2" rx="1.7" ry="1.4"/></g></symbol>
  <symbol id="i-tram" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="3" width="13" height="13" rx="3"/><path d="M5.5 10h13M9 21l2-3.5M15 21l-2-3.5"/><circle cx="9" cy="13" r=".6" fill="currentColor"/><circle cx="15" cy="13" r=".6" fill="currentColor"/></g></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></g></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-4-4M20 16H6l4 4"/></g></symbol>
  <symbol id="i-go" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></g></symbol>
  <symbol id="i-city" viewBox="0 0 24 24"><path fill="currentColor" d="M4 20V10l3-2 3 2V7l2-3 2 3v3l3-2 3 2v10h-6v-4h-4v4z"/></symbol>
</svg>

<header class="topbar">
  <a class="brand" href="./" aria-label="小比百貨艾澤拉斯導航首頁"><img src="assets/logo.png" alt="小比百貨寶箱公會商標"><span><small>小比百貨</small><strong>艾澤拉斯導航</strong></span></a>
  <nav class="sn-nav" aria-label="功能切換"><a href="./" aria-current="page">路線導航</a><a href="talents/">天賦模擬器</a></nav>
  <details class="sn-more" id="moreMenu">
    <summary>更多設定</summary>
    <div class="sn-more-panel">
      <div class="sn-more-row"><span>路線偏好</span>
        <div class="seg" role="group" aria-label="路線偏好">
          <button type="button" data-pref="rec" aria-pressed="true">推薦路線</button>
          <button type="button" data-pref="few" aria-pressed="false">少轉乘</button>
        </div>
      </div>
      <button type="button" class="fp-cond" id="fpOpen"><span>鳥點總表</span><span><b id="fpCount">65／65</b> 可用</span></button>
      <button type="button" class="fav-btn" id="favJump"><span>☆ <span class="lbl">我的收藏</span></span><b id="favCount">0</b></button>
      <section class="shelf" id="shelf" aria-labelledby="shelfTitle"><h2 id="shelfTitle" class="sr-only">收藏與常用路線</h2><div class="cards" id="cards"></div></section>
      <button type="button" id="sourcesOpen" class="link-btn">交通來源與支援範圍</button>
    </div>
  </details>
</header>

<section class="hero sn-hero" aria-labelledby="heroTitle">
  <h1 id="heroTitle">從哪裡到哪裡？</h1>
  <p class="lede">選起終點查路線；沒開的鳥點或不走的中途點，按 × 自動改道。</p>
  <form class="planbar" id="planForm" autocomplete="off">
    <div class="field" data-side="from">
      <label for="fromInput">起點</label>
      <svg class="ico"><use href="#i-search"/></svg>
      <input id="fromInput" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="pickList" placeholder="輸入一兩個字，如「鐵爐」">
      <button type="button" class="clear" data-clear="from" aria-label="清除起點">×</button>
    </div>
    <button type="button" class="swap" id="swapBtn" aria-label="交換起點與終點"><svg class="ico"><use href="#i-swap"/></svg></button>
    <div class="field" data-side="to">
      <label for="toInput">終點</label>
      <svg class="ico"><use href="#i-search"/></svg>
      <input id="toInput" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="pickList" placeholder="主城、鳥點或港口">
      <button type="button" class="clear" data-clear="to" aria-label="清除終點">×</button>
    </div>
    <div class="faction" role="group" aria-label="陣營">
      <button type="button" data-faction="alliance" aria-pressed="true"><span class="crest"></span>聯盟</button>
      <button type="button" data-faction="horde" aria-pressed="false"><span class="crest"></span>部落</button>
    </div>
    <button type="submit" class="go">查路線 <svg class="ico"><use href="#i-go"/></svg></button>
  </form>
</section>

<main class="desk sn-desk" id="desk">
  <div class="desk-inner">
    <nav class="beats" id="beats" aria-label="旅程節點" hidden></nav>
    <div class="desk-grid">
      <article class="journal" id="journal" aria-labelledby="jTitle">
        <button type="button" class="sheet-handle" id="sheetToggle" hidden aria-expanded="true" aria-controls="journalBody"><i></i><span id="sheetLabel"></span></button>
        <header class="j-head">
          <h2 id="jTitle">—</h2>
          <p class="j-meta" id="jMeta"></p>
          <div class="j-tools">
            <button type="button" class="save" id="saveBtn" aria-pressed="false">☆ 收藏</button>
            <button type="button" class="copy" id="copyBtn">複製路線</button>
          </div>
        </header>
        <div class="j-body" id="journalBody"></div>
      </article>

      <aside class="atlas" aria-label="旅程地圖">
        <button type="button" class="map-toggle" id="mapToggle" aria-expanded="false" aria-controls="atlasPage">顯示地圖</button>
        <div class="atlas-page" id="atlasPage">
          <div class="atlas-switch" role="group" aria-label="地圖檢視"><button id="worldMap" aria-pressed="true">旅程總覽</button><button id="regionMap" aria-pressed="false">區域位置</button></div>
          <div id="detachedNotice" class="detached-notice" hidden></div>
          <div class="viewport" id="viewport" tabindex="0" aria-label="地圖，可拖曳與縮放">
            <div class="stage" id="stage">
              <img id="mapImage" src="assets/maps/azeroth-zhtw.jpg" alt="艾澤拉斯世界地圖：卡林多與東部王國" width="1002" height="668" draggable="false">
              <svg id="routeSvg" viewBox="0 0 1002 668" preserveAspectRatio="none" aria-hidden="true"></svg>
              <div id="marks"></div>
            </div>
          </div>
          <span class="pin a"></span><span class="pin b"></span><span class="pin c"></span><span class="pin d"></span>
          <p class="atlas-tag" id="mapCaption">交通連接示意；依步驟座標轉乘</p>
          <div class="atlas-tools">
            <button type="button" id="zoomIn" aria-label="放大地圖">＋</button>
            <button type="button" id="zoomOut" aria-label="縮小地圖">－</button>
            <button type="button" id="zoomFit" aria-label="顯示整段路線">⌖</button>
          </div>
        </div>
      </aside>
    </div>
  </div>
</main>

<footer class="site-foot">
  <span>小比百貨・冒險者的帶路夥伴</span>
  <span id="coverageNote"></span>
</footer>

<!-- picker 直接掛在 body（position:fixed; z-index:1000） -->
<div class="picker" id="picker" hidden>
  <div class="pick-side">
    <p class="pick-for" id="pickFor">選擇起點</p>
    <div class="cat-tabs" role="group" aria-label="地點分類">
      <button type="button" data-cat="all" aria-pressed="true">全部 <small></small></button>
      <button type="button" data-cat="city" aria-pressed="false">主城 <small></small></button>
      <button type="button" data-cat="fp" aria-pressed="false">鳥點 <small></small></button>
      <button type="button" data-cat="port" aria-pressed="false">港口 <small></small></button>
    </div>
    <button type="button" class="pick-close" id="pickClose" aria-label="關閉地點選單">×</button>
  </div>
  <div class="pick-main"><label class="picker-search"><span class="sr-only">搜尋地點</span><input id="pickQuery" type="search" aria-label="搜尋地點" autocomplete="off" placeholder="輸入地名、區域或別名"></label>
    <div class="pick-top">
      <div class="cont-tabs" role="group" aria-label="大陸">
        <button type="button" data-cont="all" aria-pressed="true">全部大陸</button>
        <button type="button" data-cont="ek" aria-pressed="false">東部王國</button>
        <button type="button" data-cont="kal" aria-pressed="false">卡林多</button><button type="button" data-cont="other" aria-pressed="false">其他地區</button>
      </div>
      <label class="zone-filter"><span class="sr-only">區域</span><select id="zoneFilter" aria-label="區域"><option value="all">全部區域</option></select></label><span class="pick-meta" id="pickMeta" aria-live="polite"></span>
    </div>
    <div class="pick-list" id="pickList" role="listbox" aria-label="地點候選"></div>
  </div>
</div>
<dialog id="fpDialog" aria-labelledby="fpTitle">
  <div class="dlg-head"><h2 id="fpTitle">尚未開通的鳥點</h2><button type="button" class="dlg-x" data-close aria-label="關閉">×</button></div>
  <p class="dlg-p">預設全部鳥點可用。勾選還沒開的鳥點，路線就不會在那裡起降；仍可搭船或步行抵達。設定會儲存在這個瀏覽器。</p>
  <label class="fp-search"><span class="sr-only">搜尋鳥點</span><input id="fpFilter" type="search" aria-label="搜尋鳥點" placeholder="搜尋鳥點或區域"></label><div class="fp-list" id="fpList"></div>
  <div class="dlg-foot"><button type="button" class="link-btn" id="fpReset">恢復全部鳥點</button><button type="button" class="primary" data-close>完成並重新規劃</button></div>
</dialog>
<dialog id="sourcesDialog" aria-labelledby="sourcesTitle"><div class="dlg-head"><h2 id="sourcesTitle">交通來源與支援範圍</h2><button class="dlg-x" data-close aria-label="關閉來源說明">×</button></div><div id="sourceBody" class="source-body"></div><div class="dlg-foot"><button class="primary" data-close>我知道了</button></div></dialog><div id="toast" role="status" hidden></div>

<script type="module" src="navigator.js?v=10"></script>
</body>
</html>
